<style>
  :root{--bg:#0b0e16;--card:#151a28;--border:#27314a;--txt:#f5f7ff;--mut:#9aa5c4;--sh:#ff5722;--sh2:#ff7a50;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:50px;}
  .hero{background:linear-gradient(160deg,rgba(255,87,34,0.18),rgba(168,85,247,0.12));border-bottom:1px solid var(--border);padding:22px 16px 18px;text-align:center;}
  .hero h1{font-size:19px;font-weight:800;margin-bottom:4px;}
  .hero p{font-size:13px;color:var(--mut);max-width:480px;margin:0 auto;}
  .sticky-bar{position:sticky;top:0;z-index:20;background:rgba(11,14,22,0.93);backdrop-filter:blur(10px);padding:11px 14px;border-bottom:1px solid var(--border);}
  .wrap{max-width:780px;margin:0 auto;}
  .search{width:100%;background:#080b12;border:1px solid var(--border);color:#fff;padding:11px 14px;border-radius:12px;font-size:14px;outline:none;}
  .search:focus{border-color:var(--sh);}
  .pills{display:flex;gap:7px;overflow-x:auto;padding-top:9px;scrollbar-width:none;}
  .pills::-webkit-scrollbar{display:none;}
  .pill{white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--mut);font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;cursor:pointer;}
  .pill.active{background:var(--sh);border-color:var(--sh);color:#fff;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:11px;padding:15px 14px;max-width:780px;margin:0 auto;}
  .item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;}
  .top-badges{display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap;}
  .num{font-size:11px;font-weight:900;background:#090c14;border:1px solid var(--border);padding:2px 8px;border-radius:99px;color:#7dd3fc;}
  .hot{font-size:10.5px;font-weight:800;background:rgba(255,87,34,0.18);color:#ff9472;padding:2px 7px;border-radius:99px;}
  .name{font-size:13.2px;font-weight:700;line-height:1.38;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .meta{font-size:11.5px;color:var(--mut);}
  .price{font-size:16.5px;font-weight:900;color:#ff784e;margin-top:2px;}
  .buy{display:block;text-align:center;background:linear-gradient(135deg,var(--sh),var(--sh2));color:#fff;text-decoration:none;font-weight:800;font-size:12.8px;padding:9px 10px;border-radius:10px;}
  .empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:36px 12px;font-size:13.5px;}
</style>
</head>

let CAT = 'all';
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function setCat(c,btn){
  CAT=c;
  document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function render(){
  const q = document.getElementById('q').value.trim().toLowerCase().replace(/^#/,'');
  const list = ITEMS.filter(it => {
    if (CAT === 'posted' && !it.posted) return false;
    if (CAT !== 'all' && CAT !== 'posted' && it.niche !== CAT) return false;
    if (!q) return true;
    return String(it.num) === q || it.name.toLowerCase().includes(q) || it.shop.toLowerCase().includes(q);
  });
  const g = document.getElementById('grid');
  if (!list.length) { g.innerHTML = '<div class="empty">Tiada barang dijumpai untuk carian tu 😅 Cuba taip kata kunci lain!</div>'; return; }
  g.innerHTML = list.map(it => {
    const sold = it.sales >= 1000 ? (it.sales/1000).toFixed(1)+'k+' : it.sales+'+';
    return '<div class="item">' +
      '<div>' +
        '<div class="top-badges"><span class="num">#'+it.num+'</span>'+(it.posted?'<span class="hot">🧵 Di Threads</span>':'')+'</div>' +
        '<div class="name" style="margin-top:7px;">'+esc(it.name)+'</div>' +
      '</div>' +
      '<div>' +
        '<div class="meta">⭐ '+it.rating+' • '+sold+' terjual</div>' +
        '<div class="price">RM'+it.price+'</div>' +
        '<a class="buy" style="margin-top:8px;" href="'+esc(it.url)+'" target="_blank" rel="noopener">🛒 Usha di Shopee ↗</a>' +
      '</div>' +
    '</div>';
  }).join('');
}
render();
